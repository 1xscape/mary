/* October 2026: quiet, student-first interface */
:root {--bg:#fafafa;--surface:#fff;--ink:#25252a;--line:#ececee;--soft:#f7f7f8;--accent:#5f5360;--good:#247d56;--bad:#c3484e}
.rail {background:#fff;border-right:1px solid #ededf0;width:236px;flex-basis:236px}
.brand {margin:23px 18px 20px;gap:9px}.brand-mark {width:36px;height:36px;border-radius:10px;font-size:12px}.brand strong {font-size:12px;letter-spacing:.4px}.brand small {font-size:9px;letter-spacing:.5px}
.rail .unit-label,.rail .rail-foot,.rail .chapter small {display:none!important}
.chapter {padding:10px 14px!important;gap:9px!important;margin:0 7px!important;border-radius:9px!important}
.chapter .no {font-size:10px;opacity:.58}
.chapter-title {font-size:12px!important;line-height:1.35!important}
.topbar {height:62px!important;background:#fff!important;border-bottom:1px solid #f0f0f0!important}
.top-brand {color:#929197;font-size:10px;letter-spacing:.4px;font-weight:600}
.topbar .subtle-btn {border:0!important;background:transparent!important;color:#747279!important;font-size:12px!important}
.reading {padding-top:38px}.page-heading {font-size:clamp(25px,3vw,35px);font-weight:800;line-height:1.13;letter-spacing:-1.15px;margin:0 0 26px!important}
.content-surface {border:1px solid #eee!important;box-shadow:none!important;padding:29px!important}
.section {margin-bottom:31px}.section-title {font-size:15px!important;letter-spacing:-.22px}.intro {color:#565760!important}
.callout {background:#f8f8f9;border-color:#eeeeef;padding:13px 16px;border-radius:11px}
.callout strong {letter-spacing:.22px;font-size:10px}.callout p {font-size:13px}
.frame,.mini-card,.card,.question,.speech-bubble,.post {border-color:#ececef!important;box-shadow:none!important}
.question,.sentence {background:#fafafb}
.option:has(input:checked) {background:#f3f2f5;border-color:#bcb5c4}
.option.correct,.option:has(input:checked).correct {border-color:#4ea478!important;background:#e9f7ef!important;color:#1a6443}
.option.incorrect,.option:has(input:checked).incorrect {border-color:#df8b8b!important;background:#fff0f0!important;color:#9e3439}
.choice-select.correct,.answer-input.correct,.connect-card.matched-right {border-color:var(--good)!important;background:#eaf7ee!important;color:#185b3e}
.choice-select.incorrect,.answer-input.incorrect,.connect-card.matched-wrong {border-color:var(--bad)!important;background:#fff0f0!important;color:#a03439}
.correction {font-size:11px;display:none;margin:4px 0 0;font-weight:600}.correction.right {color:var(--good)}.correction.wrong {color:var(--bad)}
.answered-right .chip-options .selected {background:#eaf7ee;border-color:var(--good)}
.answered-wrong .chip-options .selected {background:#fff0f0;border-color:var(--bad)}
button:disabled.connect-card,button:disabled.small-choice {opacity:1;cursor:default}
.inline-sentence {line-height:2.5;font-size:13px;padding:12px 13px;margin-bottom:7px;background:#fafafb;border:1px solid #ededee;border-radius:10px}
.inline-answer {display:inline-block;vertical-align:middle;width:clamp(115px,24vw,245px);height:38px;padding:7px 10px;margin:0 4px}
.inline-sentence .correction {line-height:1.4}
.connect-widget {margin:12px 0 20px}.connect-help {font-size:12px;color:#8b8b90;margin:4px 0 12px}
.connect-board {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18%;position:relative;align-items:start}
.connect-lines {position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
.connect-col {display:flex;flex-direction:column;gap:9px;min-width:0;position:relative;z-index:2}
.connect-row {display:flex;flex-direction:column;gap:1px;min-width:0}
.connect-card {display:flex;align-items:center;gap:10px;min-height:54px;width:100%;text-align:left;border:1px solid #e5e5e8;border-radius:10px;padding:11px 12px;background:#fff;color:#3d3e44;font-size:12px;line-height:1.45;transition:border-color .12s,background .12s;}
.connect-letter {display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:#f1f1f3;color:#888;font-size:10px;font-weight:800;flex:none}
.connect-card.pair-selected,.connect-card.pair-selected:hover {border-color:#796174;background:#f2edf2;box-shadow:0 0 0 2px #dfd2dd}
.connect-card:not(:disabled):hover {border-color:#a9a0a9}
.connect-row .correction {padding-left:5px;font-size:10px}
.sort-chip {touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;border:1px solid #d9d9df;background:#fff;border-radius:9px;padding:10px 12px}
.sort-chip.chosen {border-color:#726071!important;background:#eee9ee!important}
.sort-zone {background:#fff;border:1px dashed #d6d4d7;min-height:164px;cursor:pointer;transition:background .16s,border .16s}
.sort-zone.ready,.sort-zone.over {background:#f6f0f4;border-color:#93828e}
.sort-pool {background:#f8f8f8;padding:15px;min-height:76px}
.sort-note {font-size:11px;color:#87858a}
.drag-ghost {position:fixed;z-index:10000;background:#f9f1f5;border:1px solid #92838f;border-radius:10px;padding:10px 12px;font-size:12px;pointer-events:none;box-shadow:0 6px 23px #0002}
.nav-button.primary {background:#28272b!important;border-color:#28272b!important}
.footer-nav {margin:23px 0 15px}.dots {font-size:10px;color:#96959a}
.post-body {background:white}
@media(max-width:1050px){.rail{width:210px;flex-basis:210px}}
@media(max-width:750px){.topbar{height:58px!important}.reading{padding-top:25px}.page-heading{font-size:26px}.content-surface{padding:17px!important}.connect-board{gap:10%}}
@media(max-width:430px){.connect-board{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8%}.connect-card{font-size:11px;padding:8px;gap:6px;min-height:64px}.connect-letter{min-width:17px;height:18px;font-size:9px}.inline-answer{width:48%;max-width:180px}}

add('Past Simple vs Past Continuous','Grammar focus',5,
S('Past Continuous',`<div class="rule-grid"><div class="rule-card"><h3>1 · What was happening?</h3><p>Use Past Continuous for an action that was already in progress at a particular moment in the past.</p><p>At 8:30, Masha <b>was getting ready</b>.</p><p>Kristina <b>was tidying up</b> the living room.</p><div class="rule-form"><b>Form:</b> was / were + verb-ing<br>I was waiting · They were talking<br><b>Negative:</b> wasn’t / weren’t + verb-ing<br><b>Question:</b> Was she waiting? · Were they talking?</div></div><div class="rule-card"><h3>2 · Background / scene</h3><p>Use it to describe the situation around the main events, or two longer actions happening at the same time.</p><p>While Masha <b>was scrolling through</b> TikTok, Kristina <b>was putting</b> some clothes away.</p><p>They <b>weren’t paying</b> attention to the time.</p><div class="rule-form">Think: <b>What was already happening?</b></div></div></div>`)+
S('Past Simple',`<div class="rule-grid"><div class="rule-card"><h3>1 · What happened?</h3><p>Use Past Simple for a finished action, a new event, or a sequence of completed events.</p><p>Kirill <b>called</b>. Masha <b>checked</b> the address. They <b>left</b> the flat.</p><div class="rule-form"><b>Regular:</b> call → called<br><b>Irregular:</b> go → went · sleep → slept<br><b>Negative:</b> didn’t + base verb → didn’t go<br><b>Question:</b> Did they go?</div></div><div class="rule-card"><h3>2 · An event interrupts the background</h3><p>Use Past Continuous for the longer action already in progress, and Past Simple for the shorter event that happens during it.</p><p>They <b>were walking</b> to the restaurant when Masha’s phone <b>died</b>.</p><p>While they <b>were waiting</b> for a taxi, it <b>started</b> raining.</p><div class="rule-form">Think: <b>What happened next?</b></div></div></div>`)+
S('How to choose',`<div class="quick-rule"><div><b>PAST CONTINUOUS</b>What was happening? What was in progress?</div><div><b>PAST SIMPLE</b>What happened? What changed the situation?</div><div><b>ONE LONG + ONE SHORT</b>We <b>were walking</b> when it <b>started</b> raining.</div><div><b>SEQUENCE OF EVENTS</b>We <b>left</b>, <b>called</b> Kirill and <b>found</b> a café.</div></div><div class="callout"><p><b>when</b> often introduces the shorter event: We were leaving <b>when</b> Kirill called.</p><p><b>while</b> often introduces an action in progress: <b>While</b> we were leaving, Kirill was waiting outside.</p><p>Do not choose by the word alone. Choose by the <b>meaning</b>: background or event?</p></div>`+
mc('p9q1','Masha ___ through TikTok when Kristina called her.',['was scrolling','scrolled','was scroll'],0)+
mc('p9q2','They were getting ready when Kirill ___.',['called','was calling','callled'],0)+
mc('p9q3','Which form is correct?', ["They didn't went.","They didn't go.","They weren't go."],1)),'Grammar');

add('One Bad Friday','Grammar story',7,
S('Complete the story',intro('Choose the correct form in each gap.')+`<div class="story-cloze"><p>Last Friday started normally. Masha and Kristina ${storyChoice('p13s1',['were getting ready','was get ready','getted ready'],0)} for dinner with Kirill after work. Masha usually saves restaurant addresses as soon as she sees them, but that evening she ${storyChoice('p13s2',['was scrolling through','scrolleded through','was scroll through'],0)} TikTok instead. A fashion video ${storyChoice('p13s3',['popped up','poped up','was pop up'],0)} on her feed, and she immediately got distracted. While she ${storyChoice('p13s4',['was watching','watcheded','was watch'],0)} it, Kristina ${storyChoice('p13s5',['was tidying up','tidyed up','was tidy up'],0)} the living room because there was too much clutter and a few bags were still lying around.</p><p>At about eight, Kirill ${storyChoice('p13s6',['called','callled','was call'],0)} and asked where they were. He was already near the restaurant. Masha ${storyChoice('p13s7',['realised','was realise','realiseded'],0)} they were late, so they quickly ${storyChoice('p13s8',['put','putted','were put'],0)} their things away and ${storyChoice('p13s9',['left','leaved','were leave'],0)} the flat. They ${storyChoice('p13s10',["didn't have","didn't had","weren't have"],0)} much time, but Masha still wanted to stop for coffee. Kristina was like, “No way. We are already late.”</p><p>While they ${storyChoice('p13s11',['were walking','was walking','walkeded'],0)} to the metro, Masha checked her phone and suddenly ${storyChoice('p13s12',['noticed','was notice','noticeded'],0)} that the battery was at 1%. She asked Kristina for a power bank, but Kristina ${storyChoice('p13s13',['forgot','forgetted','was forget'],0)} it at home. “My bad,” she said. They did not have any charger, and there was only a little battery left, so Masha stopped scrolling and tried to remember the address.</p><p>Then, out of nowhere, it ${storyChoice('p13s14',['started','startted','was start'],0)} raining. They ${storyChoice('p13s15',['ran','runned','were run'],0)} to the nearest taxi, but traffic was terrible. While the driver ${storyChoice('p13s16',['was looking','looked','was look'],0)} for another route, Masha ${storyChoice('p13s17',['came','comed','was come'],0)} across a screenshot of the restaurant in her gallery. That was when they realised something worse: they had been going to the wrong address.</p><p>They called Kirill and explained everything. He laughed because he had actually gone to the wrong entrance first, too. In the end, all three of them ${storyChoice('p13s18',['ended up','endded up','were end up'],0)} in a tiny café nearby. They ${storyChoice('p13s19',['had','haved','were have'],0)} some fries, a few drinks and no proper dinner, but nobody cared anymore. The next morning, Masha ${storyChoice('p13s20',['slept','sleeped','was sleep'],0)} until almost noon. She usually wakes up much earlier, but after that night she needed it.</p></div>`)+
S('Quick check',mc('p13why','Why do we use “were walking” before “noticed”?',['Walking was already in progress when the new event happened.','Walking was a regular habit.','Both actions happened every Friday.'],0)+
mc('p13recycle','Which phrase recycles language from an earlier lesson?',['a little battery','cracked under pressure','airport security'],0)),'Grammar');

S('Read',intro('Read the story.')+`<div class="magazine-reading"><div class="magazine-tag">SHORT STORY</div><div class="magazine-copy"><h3>The Wrong Restaurant</h3><div class="story-text"><p>Kristina usually checks reservations twice, but that evening she was rushing after work. Before they left, she was trying to tidy up because there were too many bags lying around. Masha was scrolling through TikTok and came across a restaurant video that looked amazing, so she saved it for later.</p><p>They met Kirill in the centre. There were <b>a few</b> people outside the restaurant, but the name on the door looked wrong. While Kristina was checking her messages, Masha realised there were two places with almost the same name. They did not have <b>much</b> time, and Masha did not have <b>any</b> battery left.</p><p>They got stuck in traffic and eventually ended up at a tiny bar nearby. There were <b>some</b> fries left in the kitchen, so they shared them. “That’s so real,” Masha said when Kirill admitted he also went to the wrong place first.</p></div></div></div>`)+

function formatAnswer(el,ans,id){if(ans===null||ans===undefined)return '';const spec=ANSWERS[id];if(spec?.type==='one'){if(el?.matches('[data-match-row]')){const widget=el.closest('[data-match-prefix]');const b=widget?.querySelector(`[data-connect-side="right"][data-connect-index="${ans}"]`);return b?.innerText?.trim()||String(ans)}let opt=el?.querySelector(`input[value="${ans}"]`);if(opt)return opt.closest('label')?.innerText?.trim()||'';let sel=el?.querySelector('select');if(sel)return sel.options[Number(ans)+1]?.text||String(ans);let btn=el?.querySelectorAll('.small-choice')[Number(ans)];if(btn)return btn.textContent.trim();}if(spec?.type==='many')return ans.map(i=>el?.querySelector(`input[value="${i}"]`)?.closest('label')?.innerText?.trim()).filter(Boolean).join(' · ');if(Array.isArray(ans))return ans[0];return String(ans)}

   gain.gain.setValueAtTime(0,time);gain.gain.linearRampToValueAtTime(volume,time+0.012);gain.gain.exponentialRampToValueAtTime(0.0001,time+duration);

 }catch(e){/* Audio is an optional enhancement; never break an answer */}
}

function paintSingle(id){const spec=ANSWERS[id];if(!spec||spec.ans===null)return;const container=currentBlock(id);if(!container)return;const wasTried=(state.attempts?.[id]||0)>0||!!state.solved?.[id];const ok=!!state.solved?.[id];const exhausted=(state.attempts?.[id]||0)>=3&&!ok;const cor=container.querySelector(`[data-correction="${id}"]`);const hasAnswer=vals[id]!==undefined&&vals[id]!=='';container.classList.toggle('answered-right',ok);container.classList.toggle('answered-wrong',!ok&&wasTried);container.querySelectorAll('.option,.small-choice,.answer-input,.choice-select,.connect-card').forEach(n=>{n.classList.remove('correct','incorrect');if(!wasTried)return;if(n.matches('.option')&&n.querySelector('input:checked'))n.classList.add(ok?'correct':'incorrect');if(n.matches('.small-choice')&&String(n.dataset.val)===String(vals[id]))n.classList.add(ok?'correct':'incorrect');if(n.matches('.answer-input,.choice-select,.connect-card'))n.classList.add(ok?'correct':'incorrect')});container.querySelectorAll('input,select,button[data-chip]').forEach(n=>{if(completed(id))n.disabled=true});if(cor){cor.style.display=wasTried?'block':'none';cor.className='correction '+(ok?'right':'wrong');cor.textContent=ok?'✓ Correct':exhausted?`✕ No attempts left. Correct answer: ${formatAnswer(container,spec.ans,id)}`:`✕ Try again · ${3-(state.attempts[id]||0)} ${3-state.attempts[id]===1?'attempt':'attempts'} left`;}}
function paintAnswerStatuses(){Object.keys(ANSWERS).forEach(id=>paintSingle(id));document.querySelectorAll('[data-match-prefix]').forEach(widget=>{const prefix=widget.dataset.matchPrefix;widget.querySelectorAll('[data-connect-side="left"]').forEach(button=>{const i=+button.dataset.connectIndex,id=prefix+i;button.classList.toggle('matched-right',!!state.solved[id]);button.classList.toggle('matched-wrong',!state.solved[id]&&(state.attempts[id]||0)>0);if(completed(id))button.disabled=true});widget.querySelectorAll('[data-connect-side="right"]').forEach(button=>{const idx=+button.dataset.connectIndex;const solved=Array.from(widget.querySelectorAll('[data-connect-side="left"]')).some(left=>state.solved[prefix+left.dataset.connectIndex]&&String(vals[prefix+left.dataset.connectIndex])===String(idx));button.classList.toggle('matched-right',solved);button.disabled=solved;});});}
function checkOne(id){const spec=ANSWERS[id];if(!spec||spec.ans==null||completed(id))return;const v=vals[id];if(v==null||v===''||(Array.isArray(v)&&!v.length))return;const signature=JSON.stringify(v);if(state.lastTried?.[id]===signature)return;state.lastTried[id]=signature;const right=validate(id);if(right){state.solved[id]=true}else{state.attempts[id]=(state.attempts[id]||0)+1;}playFeedback(right);save();paintSingle(id);paintAnswerStatuses();updateMatchLayouts();refreshReorders();drawConnections();}
let inputTimers={};function scheduleCheck(id,immediate=false){clearTimeout(inputTimers[id]);if(!ANSWERS[id])return;inputTimers[id]=setTimeout(()=>checkOne(id),immediate?0:1300)}
function drawConnections(){document.querySelectorAll('[data-match-prefix]').forEach(widget=>{const svg=widget.querySelector('.connect-lines');if(!svg)return;const board=widget.querySelector('.connect-board'),rect=board.getBoundingClientRect();if(!rect.width)return;svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);svg.innerHTML='';const prefix=widget.dataset.matchPrefix;widget.querySelectorAll('[data-connect-side="left"]').forEach(btn=>{const id=prefix+btn.dataset.connectIndex,to=vals[id];if(to===undefined||to==='')return;const target=widget.querySelector(`[data-connect-side="right"][data-connect-index="${to}"]`);if(!target)return;const a=btn.getBoundingClientRect(),b=target.getBoundingClientRect(),x1=a.right-rect.left+3,y1=a.top-rect.top+a.height/2,x2=b.left-rect.left-3,y2=b.top-rect.top+b.height/2;const color=state.solved[id]?'#368767':(state.attempts[id]>0?'#c46767':'#a3a6ad');const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M ${x1} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}`);path.setAttribute('stroke',color);path.setAttribute('stroke-width','2.3');path.setAttribute('fill','none');path.setAttribute('opacity','.85');svg.appendChild(path);});});}
let selectedConnect=null;function clickConnect(button){const widget=button.closest('[data-match-prefix]'),prefix=button.dataset.connectPrefix,side=button.dataset.connectSide,i=+button.dataset.connectIndex;if(button.disabled)return;if(!selectedConnect){selectedConnect={prefix,side,i};button.classList.add('pair-selected');return;}if(selectedConnect.prefix!==prefix||selectedConnect.side===side){document.querySelectorAll('.pair-selected').forEach(b=>b.classList.remove('pair-selected'));selectedConnect={prefix,side,i};button.classList.add('pair-selected');return;}const left=side==='left'?i:selectedConnect.i,right=side==='right'?i:selectedConnect.i,id=prefix+left;document.querySelectorAll('.pair-selected').forEach(b=>b.classList.remove('pair-selected'));selectedConnect=null;if(completed(id))return;const other=widget.querySelectorAll('[data-connect-side="left"]');other.forEach(b=>{const otherid=prefix+b.dataset.connectIndex;if(otherid!==id&&!state.solved[otherid]&&String(vals[otherid])===String(right)){vals[otherid]='';state.lastTried[otherid]='';}});vals[id]=String(right);save();checkOne(id);paintAnswerStatuses();updateMatchLayouts();refreshReorders();drawConnections();}
function doSortUpdate(sortid,item,to){const widget=document.querySelector(`[data-sort="${sortid}"]`);if(!widget)return;let items=widget.querySelectorAll('[data-sortkey][data-item]');const count=items.length;let old=vals[sortid]||Array(count).fill(-1);if(old.length!==count)old=Array(count).fill(-1);old[+item]=to;vals[sortid]=old;pendingSort=null;const chip=widget.querySelector(`[data-sortkey="${sortid}"][data-item="${item}"]`);const dest=to===-1?widget.querySelector('.sort-pool'):widget.querySelector(`.sort-zone[data-zone="${to}"] .zone-chips`);if(chip&&dest){const title=chip.textContent.replace(/\s*×\s*$/, '').trim();chip.textContent=title+(to===-1?'':' ×');chip.classList.remove('chosen');dest.appendChild(chip);}widget.querySelectorAll('.sort-zone').forEach(z=>z.classList.remove('ready','over'));save();}
let draggedPointer=null,dragGhost=null,ignoreNextSortClick=false;
document.addEventListener('pointerdown',e=>{const chip=e.target.closest('[data-sortkey][data-item]');if(!chip)return;draggedPointer={id:chip.dataset.sortkey,item:+chip.dataset.item,startX:e.clientX,startY:e.clientY,dragging:false};});
document.addEventListener('pointermove',e=>{if(!draggedPointer)return;const dx=e.clientX-draggedPointer.startX,dy=e.clientY-draggedPointer.startY;if(!draggedPointer.dragging&&Math.hypot(dx,dy)>9){draggedPointer.dragging=true;dragGhost=document.createElement('div');dragGhost.className='drag-ghost';dragGhost.textContent=document.querySelector(`[data-sortkey="${draggedPointer.id}"][data-item="${draggedPointer.item}"]`)?.textContent||'';document.body.appendChild(dragGhost);}if(draggedPointer.dragging){e.preventDefault();dragGhost.style.left=e.clientX+11+'px';dragGhost.style.top=e.clientY+9+'px';document.querySelectorAll('.sort-zone,.sort-pool').forEach(z=>z.classList.toggle('over',!!(document.elementFromPoint(e.clientX,e.clientY)?.closest('.sort-zone,.sort-pool')===z)));}}, {passive:false});
document.addEventListener('pointerup',e=>{if(!draggedPointer)return;const p=draggedPointer;draggedPointer=null;dragGhost?.remove();dragGhost=null;document.querySelectorAll('.sort-zone,.sort-pool').forEach(z=>z.classList.remove('over'));if(!p.dragging)return;ignoreNextSortClick=true;setTimeout(()=>ignoreNextSortClick=false,100);const dest=document.elementFromPoint(e.clientX,e.clientY)?.closest('.sort-zone,.sort-pool');if(dest)doSortUpdate(p.id,p.item,+dest.dataset.zone);});
let bankChosen=null,reorderDragged=null;
function setBankWord(word,slot){
 const node=slot||[...document.querySelectorAll('[data-bank-slot]')].find(n=>!n.disabled&&!n.value.trim());
 if(!node||node.disabled)return;
 node.value=word;node.dispatchEvent(new Event('input',{bubbles:true}));node.dispatchEvent(new Event('change',{bubbles:true}));
 bankChosen=null;document.querySelectorAll('.draggable-word').forEach(x=>x.classList.remove('chosen'));
}
function reorderMutate(id,item,remove=false,insertAt=null){if(completed(id))return;
 const widget=document.querySelector(`[data-reorder="${id}"]`);if(!widget)return;
 let selected=Array.isArray(vals[id])?[...vals[id]]:[];selected=selected.filter(x=>x!==item);
 if(!remove){if(insertAt==null||insertAt>=selected.length)selected.push(item);else selected.splice(insertAt,0,item);}
 vals[id]=selected;state.lastTried[id]='';save();refreshReorders();paintSingle(id);
}
document.addEventListener('click',e=>{
 const sortCheck=e.target.closest('[data-sort-check]');if(sortCheck){checkOne(sortCheck.dataset.sortCheck);return;}
 const bank=e.target.closest('[data-bank-word]');if(bank){bankChosen=bank.dataset.bankWord;const parent=bank.closest('[data-bank]'),prefix=parent?.dataset.bank;document.querySelectorAll('.draggable-word').forEach(x=>x.classList.toggle('chosen',x===bank));const input=[...document.querySelectorAll(`[data-bank-slot="${prefix}"]`)].find(n=>!n.disabled&&!n.value.trim());if(input)setBankWord(bankChosen,input);return;}
 const slot=e.target.closest('[data-bank-slot]');if(slot&&bankChosen){setBankWord(bankChosen,slot);return;}
 const tile=e.target.closest('[data-reorder-id][data-tile]');if(tile){reorderMutate(tile.dataset.reorderId,+tile.dataset.tile,false);return;}
 const placed=e.target.closest('[data-reorder-remove][data-tile]');if(placed){reorderMutate(placed.dataset.reorderRemove,+placed.dataset.tile,true);return;}
 const check=e.target.closest('[data-reorder-check]');if(check){const id=check.dataset.reorderCheck,widget=check.closest('[data-reorder]');const selected=Array.isArray(vals[id])?vals[id]:[];if(selected.length!==widget.querySelectorAll('.reorder-tray [data-tile]').length){const cor=widget.querySelector(`[data-correction="${id}"]`);cor.style.display='block';cor.className='correction wrong';cor.textContent='Place all the words before clicking CHECK.';return;}
 vals[id]=selected.map(i=>widget.querySelector(`.reorder-tray [data-tile="${i}"]`)?.textContent||'').join(' ');checkOne(id);vals[id]=selected;save();refreshReorders();return;}
 const clear=e.target.closest('[data-reorder-clear]');if(clear){vals[clear.dataset.reorderClear]=[];state.lastTried[clear.dataset.reorderClear]='';save();refreshReorders();const cor=clear.closest('[data-reorder]')?.querySelector('.correction');if(cor)cor.style.display='none';return;}
});
document.addEventListener('dragstart',e=>{const word=e.target.closest('[data-bank-word]');if(word){e.dataTransfer.setData('application/x-word-bank',word.dataset.bankWord);e.dataTransfer.effectAllowed='copy';return;}
 const tile=e.target.closest('[data-reorder-id][data-tile], [data-reorder-remove][data-tile]');if(tile){const id=tile.dataset.reorderId||tile.dataset.reorderRemove;reorderDragged={id,item:+tile.dataset.tile};e.dataTransfer.setData('application/x-reorder',JSON.stringify(reorderDragged));e.dataTransfer.effectAllowed='move';}});
document.addEventListener('dragover',e=>{if(e.target.closest('[data-bank-slot],[data-reorder-target]'))e.preventDefault();});

 const dest=e.target.closest('[data-reorder-target]');if(dest){e.preventDefault();const data=reorderDragged;if(!data||data.id!==dest.dataset.reorderTarget)return;
 const placed=[...dest.querySelectorAll('[data-reorder-remove]')];let position=placed.length;const hovered=e.target.closest('[data-reorder-remove]');if(hovered)position=placed.indexOf(hovered);

let tilePointer=null;

 const target=dest?.closest('[data-reorder-target]');if(target&&p.el.dataset.tile!=null){const id=p.el.dataset.reorderId||p.el.dataset.reorderRemove;if(id===target.dataset.reorderTarget)reorderMutate(id,+p.el.dataset.tile,false);}
});
document.addEventListener('input',e=>{const node=e.target,id=node.dataset?.k;if(!id)return;if(node.type==='radio'||node.type==='checkbox')return;vals[id]=node.type==='range'?Number(node.value):node.value;save();updateLive();if(node.matches('.answer-input')){const block=currentBlock(id);block?.classList.remove('answered-wrong');block?.querySelector('.answer-input')?.classList.remove('incorrect');if(vals[id].trim())scheduleCheck(id);}});
document.addEventListener('change',e=>{const node=e.target,id=node.dataset?.k;if(!id)return;if(node.type==='checkbox'){if(/^p\d+check/.test(id))vals[id]=node.checked;else{let a=Array.isArray(vals[id])?vals[id]:[];a=node.checked?[...new Set([...a,Number(node.value)])]:a.filter(x=>x!==Number(node.value));vals[id]=a}}else if(node.type==='range')vals[id]=+node.value;else vals[id]=node.value;save();updateLive();if(ANSWERS[id]){if(ANSWERS[id].type==='many'&&vals[id].length!==ANSWERS[id].ans.length){paintSingle(id)}else if(node.matches('.answer-input'))scheduleCheck(id,true);else {if(node.matches('.inline-select')){node.style.width='calc('+Math.min(40,Math.max(7,(node.options[node.selectedIndex]?.textContent||'Choose…').length))+'ch + 43px)';}checkOne(id);}}});
document.addEventListener('focusout',e=>{const node=e.target,id=node.dataset?.k;if(node.matches('.answer-input')&&ANSWERS[id])scheduleCheck(id,true)});
document.addEventListener('keydown',e=>{const node=e.target,id=node.dataset?.k;if(e.key==='Enter'&&node.matches('.answer-input')&&ANSWERS[id]){e.preventDefault();scheduleCheck(id,true)}if((e.key==='Enter'||e.key===' ')&&node.closest('.sort-zone')&&!node.closest('.sort-chip')){e.preventDefault();const z=node.closest('.sort-zone');if(pendingSort){doSortUpdate(pendingSort.id,pendingSort.item,+z.dataset.zone)}}});
document.addEventListener('click',e=>{const conn=e.target.closest('[data-connect-prefix]');if(conn){clickConnect(conn);return;}const chip=e.target.closest('[data-chip]');if(chip){const id=chip.dataset.chip;if(completed(id))return;vals[id]=chip.dataset.val;save();chip.parentElement.querySelectorAll('.small-choice').forEach(b=>b.classList.toggle('selected',b===chip));checkOne(id);return;}const item=e.target.closest('[data-sortkey][data-item]');if(item){if(ignoreNextSortClick)return;const id=item.dataset.sortkey,num=+item.dataset.item;if(item.closest('.sort-zone'))doSortUpdate(id,num,-1);else{pendingSort={id,item:num};document.querySelectorAll(`[data-sortkey="${id}"]`).forEach(b=>b.classList.toggle('chosen',b===item));document.querySelectorAll('.sort-zone').forEach(z=>z.classList.add('ready'));}return;}const zone=e.target.closest('.sort-zone[data-zone]');if(zone&&pendingSort){doSortUpdate(pendingSort.id,pendingSort.item,+zone.dataset.zone);return;}const dplay=e.target.closest('[data-dialogue-play]');if(dplay){playDialogue(dplay.dataset.dialoguePlay);return;}const dstop=e.target.closest('[data-dialogue-stop]');if(dstop){if('speechSynthesis'in window)speechSynthesis.cancel();return;}const speaking=e.target.closest('[data-speak]');if(speaking){if('speechSynthesis'in window){speechSynthesis.cancel();let phrase=new SpeechSynthesisUtterance(speaking.dataset.speak.replace(/^[AB]: /,''));phrase.lang='en-GB';phrase.rate=.88;let voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('en')&&v.name.toLowerCase().includes('natural'));if(voice)phrase.voice=voice;speechSynthesis.speak(phrase)}return;}const page=e.target.closest('[data-page]');if(page)navigate(+page.dataset.page);});
document.addEventListener('dragstart',e=>{const item=e.target.closest('[data-sortkey][data-item]');if(!item)return;pendingSort={id:item.dataset.sortkey,item:+item.dataset.item};e.dataTransfer.setData('text/plain',JSON.stringify(pendingSort));});document.addEventListener('dragover',e=>{const z=e.target.closest('.sort-zone,.sort-pool');if(z){e.preventDefault();z.classList.add('over')}});document.addEventListener('dragleave',e=>e.target.closest('.sort-zone,.sort-pool')?.classList.remove('over'));document.addEventListener('drop',e=>{const z=e.target.closest('.sort-zone,.sort-pool');if(!z)return;e.preventDefault();if(pendingSort){doSortUpdate(pendingSort.id,pendingSort.item,+z.dataset.zone);pendingSort=null;}});
